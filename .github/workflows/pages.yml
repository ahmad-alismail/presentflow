name: Pages

# Publishes site/ (landing page with the interactive demo) to GitHub Pages:
# https://ahmad-alismail.github.io/presentflow/
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Deploy in its own job. Run right after the upload in the same job, deploy-pages can look up the
  # artifact before GitHub lists it ("No artifacts named github-pages", actions/deploy-pages#451).
  # A separate job also lets "Re-run failed jobs" retry the deploy with the same artifact.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
